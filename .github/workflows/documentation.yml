name: Dataset registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dataset-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datasets:
    name: Validate dataset registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Validate manifest and generated README
        run: python scripts/render_datasets.py --check
